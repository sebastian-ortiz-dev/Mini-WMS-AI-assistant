readme = "README.md"
authors = [
    { name = "Sebastian", email = "sebastian090905@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "psycopg2>=2.9.13",
    "pyjwt>=2.15.1",
    "werkzeug>=3.1.9",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
